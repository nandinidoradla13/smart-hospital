<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Management</title>

    <link rel="stylesheet" href="css/patient.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🏥 Smart Hospital</h2>

        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="patients.html" class="active"><i class="fa-solid fa-user-injured"></i> Patients</a></li>
            <li><a href="doctors.html"><i class="fa-solid fa-user-doctor"></i> Doctors</a></li>
            <li><a href="appointments.html"><i class="fa-solid fa-calendar-days"></i> Appointments</a></li>
            <li><a href="billing.html"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>
            <li><a href="pharmacy.html"><i class="fa-solid fa-capsules"></i> Pharmacy</a></li>
            <li><a href="reports.html"> <i class="fa-solid fa-chart-column"></i>Reports</a></li>
            <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>

    </aside>
    <!-- Main Content -->

    <main class="main-content">

        <header>
            <h1>Patient Management</h1>
        </header>

        <!-- Add Patient Button -->

        <div class="top-bar">

            <input type="text"id="searchInput" placeholder="🔍 Search Patient...">

            <button id="addPatientBtn">
                <i class="fa-solid fa-plus"></i>
                Add Patient
            </button>

        </div>

        <!-- Patient Table -->

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Name</th>
                    <th>Age</th>
                    <th>Gender</th>
                    <th>Phone</th>
                    <th>Disease</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="patientTable">

            </tbody>

        </table>

    </main>

<!-- Add Patient Modal -->

<div class="modal" id="patientModal">

    <div class="modal-content">

        <h2>Add New Patient</h2>

        <form id="patientForm">

            <input type="text" id="full_name" placeholder="Full Name" required>

            <input type="number" id="age" placeholder="Age" required>

            <select id="gender" required>
                <option value="">Select Gender</option>
                <option>Male</option>
                <option>Female</option>
            </select>

            <input type="text" id="phone" placeholder="Phone Number" required>

            <input type="email" id="email" placeholder="Email">

            <input type="text" id="address" placeholder="Address">

            <input type="text" id="blood_group" placeholder="Blood Group">

            <input type="text" id="disease" placeholder="Disease">

            <div class="buttons">

                <button type="submit">Save</button>

                <button type="button" id="closeModal">Cancel</button>

            </div>

        </form>

    </div>

</div>

</div>
<script>

const user=JSON.parse(localStorage.getItem("user"));

if(!user){

window.location="login.html";

}

</script>
<script src="js/patient.js"></script>
<script src="js/role.js"></script>
<footer>
    <p>© 2026 Smart Hospital Management System | Developed by Nandini</p>
</footer>

</body>
</html>
