<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Appointment Management</title>

    <link rel="stylesheet" href="css/appointment.css">
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>

<body>

<div class="container">

    <aside class="sidebar">

        <h2>🏥 Smart Hospital</h2>

        <ul>
            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>
            <li><a href="patient.html"><i class="fa-solid fa-user-injured"></i> Patients</a></li>
            <li><a href="doctor.html"><i class="fa-solid fa-user-doctor"></i> Doctors</a></li>
            <li><a href="appointments.html" class="active"><i class="fa-solid fa-calendar-days"></i> Appointments</a></li>
            <li><a href="billing.html"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>
            <li><a href="reports.html"> <i class="fa-solid fa-chart-column"></i>Reports</a></li>
            <li><a href="pharmacy.html"><i class="fa-solid fa-capsules"></i> Pharmacy</a></li>
            <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>
        </ul>

    </aside>

    <main class="main-content">

        <header>
            <h1>Appointment Management</h1>
        </header>

        <div class="top-bar">

            <input
                type="text"
                id="searchAppointment"
                placeholder="🔍 Search Appointment">

            <button id="addAppointmentBtn">
                <i class="fa-solid fa-plus"></i>
                Book Appointment
            </button>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Patient</th>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Time</th>
                    <th>Status</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="appointmentTable">

            </tbody>

        </table>

    </main>
<!-- Appointment Modal -->

<div class="modal" id="appointmentModal">

    <div class="modal-content">

        <h2>Book Appointment</h2>

        <form id="appointmentForm">

            <select id="patient_id" required>
                <option value="">Select Patient</option>
            </select>

            <select id="doctor_id" required>
                <option value="">Select Doctor</option>
            </select>

            <input type="date" id="appointment_date" required>

            <input type="time" id="appointment_time" required>

            <select id="status">

                <option value="Scheduled">Scheduled</option>

                <option value="Completed">Completed</option>

                <option value="Cancelled">Cancelled</option>

            </select>

            <div class="buttons">

                <button type="submit">Save</button>

                <button type="button" id="closeAppointmentModal">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>
</div>
<script>

const user=JSON.parse(localStorage.getItem("user"));

if(!user){

window.location="login.html";

}

</script>
<script src="js/appointment.js"></script>
<script src="js/role.js"></script>
<footer>
    <p>© 2026 Smart Hospital Management System | Developed by Nandini</p>
</footer>
</body>
</html>
