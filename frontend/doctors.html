<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Doctor Management</title>

    <link rel="stylesheet" href="css/doctor.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🏥 Smart Hospital</h2>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

            <li><a href="patients.html"><i class="fa-solid fa-user-injured"></i> Patients</a></li>

            <li><a href="doctors.html" class="active"><i class="fa-solid fa-user-doctor"></i> Doctors</a></li>

            <li><a href="appointments.html"><i class="fa-solid fa-calendar-days"></i> Appointments</a></li>

            <li><a href="billing.html"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>
            <li><a href="pharmacy.html"><i class="fa-solid fa-capsules"></i> Pharmacy</a></li>
            <li><a href="reports.html"><i class="fa-solid fa-chart-column"></i> Reports</a></li>

            <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header>

            <h1>Doctor Management</h1>

        </header>

        <!-- Top Bar -->

        <div class="top-bar">

            <input
                type="text"
                id="searchInput"
                placeholder="🔍 Search Doctor..."
            >

            <button id="addDoctorBtn">

                <i class="fa-solid fa-plus"></i>

                Add Doctor

            </button>

        </div>

        <!-- Table -->

        <table>

            <thead>

                <tr>
    <th>ID</th>
    <th>Name</th>
    <th>Specialization</th>
    <th>Experience</th>
    <th>Phone</th>
    <th>Consultation Fee</th>
    <th>Actions</th>
</tr>

            </thead>

            <tbody id="doctorTable">

            </tbody>

        </table>

    </main>

</div>

<!-- Doctor Modal -->

<div class="modal" id="doctorModal">

    <div class="modal-content">

        <h2>Add Doctor</h2>

        <form id="doctorForm">

            <input
                type="text"
                id="full_name"
                placeholder="Doctor Name"
                required
            >

            <input
                type="text"
                id="specialization"
                placeholder="Specialization"
                required
            >

            <input
                type="text"
                id="phone"
                placeholder="Phone Number"
                required
            >

            <input
                type="email"
                id="email"
                placeholder="Email"
                required
            >

            <input
                type="number"
                id="experience"
                placeholder="Experience (Years)"
                required
            >

            <input
    type="number"
    id="consultation_fee"
    placeholder="Consultation Fee"
    required
>

            <div class="buttons">

                <button type="submit">

                    Save

                </button>

                <button
    type="button"
    id="closeDoctorModal"
>
    Cancel
</button>

            </div>

        </form>

    </div>

</div>
<script>

const user=JSON.parse(localStorage.getItem("user"));

if(!user){

window.location="login.html";

}

</script>
<script src="js/doctor.js"></script>
<script src="js/role.js"></script>
<footer>
    <p>© 2026 Smart Hospital Management System | Developed by Nandini</p>
</footer>
</body>

</html>
