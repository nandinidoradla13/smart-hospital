<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Doctor Dashboard</title>

<link rel="stylesheet" href="css/dashboard.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body>

<div class="container">

    <!-- Sidebar -->

    <aside class="sidebar">

        <h2>🏥 Doctor Panel</h2>

        <ul>

            <li>
                <a href="doctor-dashboard.html">
                    <i class="fa-solid fa-house"></i>
                    Dashboard
                </a>
            </li>

            <li>
                <a href="appointments.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    Appointments
                </a>
            </li>

            <li>
                <a href="patients.html">
                    <i class="fa-solid fa-user-injured"></i>
                    Patients
                </a>
            </li>

            <li>
                <a href="login.html" id="logoutBtn">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    Logout
                </a>
            </li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header>

            <h1 id="doctorName">
                Welcome Doctor 👨‍⚕️
            </h1>

        </header>

        <section class="cards">

            <div class="card">

                <h2>Total Patients</h2>

                <p id="totalPatients">0</p>

            </div>

            <div class="card">

                <h2>Today's Appointments</h2>

                <p id="todayAppointments">0</p>

            </div>

            <div class="card">

                <h2>Completed Appointments</h2>

                <p id="completedAppointments">0</p>

            </div>

        </section>

        <div class="recent-card">

            <h2>Today's Schedule</h2>

            <table id="appointmentTable">

                <thead>

                    <tr>

                        <th>Patient</th>
                        <th>Time</th>
                        <th>Status</th>

                    </tr>

                </thead>

                <tbody>

                </tbody>

            </table>

        </div>

        <div class="recent-card">

            <h2>Quick Actions</h2>

            <button onclick="location.href='appointments.html'">
                View Appointments
            </button>

            <button onclick="location.href='patients.html'">
                View Patients
            </button>

        </div>

    </main>

</div>

<script src="js/doctor-dashboard.js"></script>

</body>
</html>
