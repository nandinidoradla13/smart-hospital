 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pharmacy Management</title>

    <link rel="stylesheet" href="css/pharmacy.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>

<div class="container">

    <!-- Sidebar -->
    <aside class="sidebar">

        <h2>🏥 Smart Hospital</h2>

        <ul>

            <li><a href="dashboard.html"><i class="fa-solid fa-house"></i> Dashboard</a></li>

            <li><a href="patients.html"><i class="fa-solid fa-user-injured"></i> Patients</a></li>

            <li><a href="doctors.html"><i class="fa-solid fa-user-doctor"></i> Doctors</a></li>

            <li><a href="appointments.html"><i class="fa-solid fa-calendar-days"></i> Appointments</a></li>

            <li><a href="billing.html"><i class="fa-solid fa-file-invoice-dollar"></i> Billing</a></li>

            <li><a href="pharmacy.html" class="active"><i class="fa-solid fa-capsules"></i> Pharmacy</a></li>

            <li><a href="reports.html"><i class="fa-solid fa-chart-column"></i> Reports</a></li>

            <li><a href="login.html"><i class="fa-solid fa-right-from-bracket"></i> Logout</a></li>

        </ul>

    </aside>

    <!-- Main Content -->

    <main class="main-content">

        <header>
            <h1>Pharmacy Management</h1>
        </header>

        <div class="top-bar">

            <input
                type="text"
                id="searchMedicine"
                placeholder="🔍 Search Medicine">

            <button id="addMedicineBtn">
                <i class="fa-solid fa-plus"></i>
                Add Medicine
            </button>

        </div>

        <table>

            <thead>

                <tr>

                    <th>ID</th>
                    <th>Medicine</th>
                    <th>Category</th>
                    <th>Quantity</th>
                    <th>Price</th>
                    <th>Expiry Date</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="medicineTable">

            </tbody>

        </table>

    </main>

</div>

<!-- Modal -->

<div class="modal" id="medicineModal">

    <div class="modal-content">

        <h2>Add Medicine</h2>

        <form id="medicineForm">

            <input
                type="text"
                id="medicine_name"
                placeholder="Medicine Name"
                required>

            <input
                type="text"
                id="category"
                placeholder="Category"
                required>

            <input
                type="number"
                id="quantity"
                placeholder="Quantity"
                required>

            <input
                type="number"
                id="price"
                placeholder="Price"
                required>

            <input
                type="date"
                id="expiry_date"
                required>

            <div class="buttons">

                <button type="submit">
                    Save
                </button>

                <button
                    type="button"
                    id="closeMedicineModal">
                    Cancel
                </button>

            </div>

        </form>

    </div>

</div>
<script src="js/pharmacy.js"></script>
<script src="js/role.js"></script>
<footer>
    <p>© 2026 Smart Hospital Management System | Developed by Nandini</p>
</footer>
</body>
</html>
